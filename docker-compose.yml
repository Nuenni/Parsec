# Coolify's "Docker Compose" deploy only populates a single root-level .env for
# ${VAR} interpolation - it does not create arbitrary files like ./apps/api/.env
# inside the checkout. So the Django services below get their config via an explicit
# `environment:` block (interpolated from that same root .env) instead of `env_file`.
x-api-env: &api-env
  DEBUG: ${DEBUG:-0}
  SECRET_KEY: ${SECRET_KEY}
  CORS_ALLOWED_ORIGINS: https://${PARSEC_DOMAIN}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: plane-db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: 5432
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  DOCKERIZED: 1
  USE_MINIO: 1
  WEB_URL: https://${PARSEC_DOMAIN}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  ADMIN_BASE_URL: https://${PARSEC_DOMAIN}
  ADMIN_BASE_PATH: /god-mode
  SPACE_BASE_URL: https://${PARSEC_DOMAIN}
  SPACE_BASE_PATH: /spaces
  APP_BASE_URL: https://${PARSEC_DOMAIN}
  APP_BASE_PATH: ""
  LIVE_BASE_URL: https://${PARSEC_DOMAIN}
  LIVE_BASE_PATH: /live
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
  MINIO_ENDPOINT_SSL: 0
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  # Dockerfile.api defaults this to Plane's own changelog page - override to
  # empty so the "What's new" panel falls back to its own (already-fixed)
  # empty state instead of iframing Plane's real changelog.
  INSTANCE_CHANGELOG_URL: ""

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-web-http.entrypoints=http
      - traefik.http.routers.parsec-web-http.rule=Host(`pm.nafdo.de`)
      - traefik.http.routers.parsec-web-http.middlewares=parsec-redirect-to-https
      - traefik.http.middlewares.parsec-redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.parsec-web-https.entrypoints=https
      - traefik.http.routers.parsec-web-https.rule=Host(`pm.nafdo.de`)
      - traefik.http.routers.parsec-web-https.tls=true
      - traefik.http.routers.parsec-web-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-web.loadbalancer.server.port=3000

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-admin-https.entrypoints=https
      - traefik.http.routers.parsec-admin-https.rule=Host(`pm.nafdo.de`) && PathPrefix(`/god-mode`)
      - traefik.http.routers.parsec-admin-https.tls=true
      - traefik.http.routers.parsec-admin-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-admin.loadbalancer.server.port=3000

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-space-https.entrypoints=https
      - traefik.http.routers.parsec-space-https.rule=Host(`pm.nafdo.de`) && PathPrefix(`/spaces`)
      - traefik.http.routers.parsec-space-https.tls=true
      - traefik.http.routers.parsec-space-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-space.loadbalancer.server.port=3000

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    environment: *api-env
    depends_on:
      - plane-db
      - plane-redis
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-api-https.entrypoints=https
      - traefik.http.routers.parsec-api-https.rule=Host(`pm.nafdo.de`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static`))
      - traefik.http.routers.parsec-api-https.tls=true
      - traefik.http.routers.parsec-api-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-api.loadbalancer.server.port=8000

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    environment: *api-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    environment: *api-env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    environment: *api-env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    environment:
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      LIVE_BASE_PATH: /live
      CORS_ALLOWED_ORIGINS: https://${PARSEC_DOMAIN}
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      - api
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-live-https.entrypoints=https
      - traefik.http.routers.parsec-live-https.rule=Host(`pm.nafdo.de`) && PathPrefix(`/live`)
      - traefik.http.routers.parsec-live-https.tls=true
      - traefik.http.routers.parsec-live-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-live.loadbalancer.server.port=3000

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.parsec-minio-https.entrypoints=https
      - traefik.http.routers.parsec-minio-https.rule=Host(`pm.nafdo.de`) && PathPrefix(`/uploads`)
      - traefik.http.routers.parsec-minio-https.tls=true
      - traefik.http.routers.parsec-minio-https.tls.certresolver=letsencrypt
      - traefik.http.services.parsec-minio.loadbalancer.server.port=9000

  # No standalone `proxy` service - Coolify's own Traefik (external `coolify` network)
  # routes pm.nafdo.de straight to the containers above, replicating the path map from
  # apps/proxy/Caddyfile.ce (kept for local dev / non-Coolify deployments).

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  default: {}
  coolify:
    external: true
